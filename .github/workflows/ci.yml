name: CI

on:
  push:
    branches: [ master ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    container: 
      image: appditto/libvips:latest
    steps:
    - name: Check out code
      uses: actions/checkout@master

    - name: Set up Go 1.22
      uses: actions/setup-go@v3
      with:
        go-version: 1.22

    - name: Run Tests
      run: |
        cd server
        go test ./...

